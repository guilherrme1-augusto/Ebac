<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro</h1>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Digite seu e-mail">

        <label for="cep">CEP:</label>
        <input type="text" id="cep" placeholder="Digite o CEP (somente números)" maxlength="9">

        <label for="rua">Rua:</label>
        <input type="text" id="rua" placeholder="Preenchido automaticamente">

        <label for="numero">Número:</label>
        <input type="text" id="numero" placeholder="Digite o número">

        <label for="complemento">Complemento:</label>
        <input type="text" id="complemento" placeholder="Apartamento, bloco, etc.">

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" placeholder="Preenchido automaticamente">

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Preenchido automaticamente">

        <label for="estado">Estado:</label>
        <input type="text" id="estado" placeholder="Preenchido automaticamente">

        <button id="limpar">Limpar dados salvos</button>

        <p id="mensagem"></p>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
