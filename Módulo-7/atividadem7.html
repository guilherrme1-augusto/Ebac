<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Parquímetro</h1>
        <p class="instrucoes">Informe o valor que deseja inserir e veja o tempo de permanência e o troco.</p>

        <label for="valor">Valor (R$):</label>
        <input type="number" step="0.01" id="valor" placeholder="Ex: 2.00">

        <button id="calcular">Calcular</button>

        <p id="tempo"></p>
        <p id="troco"></p>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
