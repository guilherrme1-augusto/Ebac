<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="atividadem5.css">
</head>
<body>
    <div class="container">
        <h1>Jogo de Adivinhação</h1>
        <p class="instrucoes">Estou pensando em um número entre 1 e 100. Tente adivinhar qual é! A cada palpite eu digo se o número secreto é maior ou menor. Você tem 10 tentativas.</p>

        <label for="palpite">Seu palpite:</label>
        <input type="number" id="palpite" min="1" max="100" placeholder="Digite um número de 1 a 100">

        <button id="chutar">Chutar</button>

        <p id="mensagem"></p>
        <p id="tentativas">Tentativas restantes: 10</p>
    </div>

    <script src="atividadem5.js"></script>
</body>
</html>
